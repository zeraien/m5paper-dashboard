    <style type="text/css">
        .event_time {
            width: 151px;
        }
    </style>
    {% for day in days %}
        <h2 class="fw-bold mt-3">{{ day.label }} <small class="text-body-secondary fs-4">{{ day.date.strftime('%a %d %b') }}</small></h2>
        <table class="table">
            {% for event in day.events %}
                <tr class="align-middle">
                    {% if event.all_day %}
                        <td class="fs-1" colspan="2">{{ event.title }}</td>
                    {% else %}
                        <td class="fs-1 fw-bold text-nowrap event_time">{{ event.time_range }}</td>
                        <td class="fs-1">{{ event.title }}</td>
                    {% endif %}
                </tr>
            {% else %}
                <tr>
                    <td class="fs-4">No events</td>
                </tr>
            {% endfor %}
        </table>
    {% endfor %}
